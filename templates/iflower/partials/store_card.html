<article class="store-card"><a href="{% url 'store_detail' store.slug %}" class="store-cover">{% if store.cover %}<img src="{{ store.cover.url }}" alt="Vitrine de {{ store.name }}" loading="lazy">{% else %}<div class="image-placeholder">✿</div>{% endif %}<span class="open-badge">Aberta</span></a><div class="store-card-body"><div class="store-title"><h3><a href="{% url 'store_detail' store.slug %}">{{ store.name }}</a></h3><span>★ {{ store.average_rating|floatformat:1 }}</span></div><p>{{ store.description|truncatechars:105 }}</p><div class="store-meta"><span>⏱ {{ store.preparation_minutes }} min</span><span>Entrega R$ {{ store.default_delivery_fee }}</span><span>{{ store.city }}/{{ store.state }}</span></div></div></article>
